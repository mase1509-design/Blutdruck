<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blutdruck App (Google Sync)</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
</head>

<body class="bg-gray-100 p-4">
<h1 class="text-2xl font-bold mb-4 text-center">Blutdruck Werte</h1>

<div class="max-w-md mx-auto space-y-3">

<button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded">
Google Login & Sync starten
</button>

<form id="form" class="bg-white p-4 rounded shadow space-y-3 hidden">

<input id="date" type="date" class="w-full border rounded px-2 py-1" required>
<input id="sys" type="number" placeholder="Oberer Blutdruck" min="0" max="999" class="w-full border rounded px-2 py-1" required>
<input id="dia" type="number" placeholder="Unterer Blutdruck" min="0" max="999" class="w-full border rounded px-2 py-1" required>
<input id="pulse" type="number" placeholder="Puls" min="0" max="999" class="w-full border rounded px-2 py-1" required>

<button class="w-full bg-green-500 text-white py-2 rounded">Speichern</button>
</form>

<table class="table-auto w-full bg-white shadow rounded mt-4">
<thead class="bg-gray-200">
<tr>
<th class="p-2">Datum</th>
<th class="p-2">Oberer</th>
<th class="p-2">Unterer</th>
<th class="p-2">Puls</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script src="app.js"></script>
</body>
</html>
